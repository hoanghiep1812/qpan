<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ôn trắc nghiệm HP3</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: nghiêm túc, gọn như sổ tay huấn luyện
IDEA: phiếu thi trắc nghiệm của quân đội
PICTURE: chính thẻ câu hỏi đang làm
COLOUR and TYPE: xanh quân phục, kaki, đỏ sao; Be Vietnam Pro
LAYOUT: một cột, thanh điều khiển trên, lưới số câu dưới */
:root{color-scheme:light dark;--bg:light-dark(#efeadb,#161a12);--card:light-dark(#fff,#20261a);--ink:light-dark(#1d2416,#e9ecdf);--mut:light-dark(#5d6650,#a4ad95);--g:#3f5a2a;--gl:light-dark(#dfe8cf,#2c3a1f);--r:#c0392b;--rl:light-dark(#f7dcd8,#4a2420);--line:light-dark(#d6d0bd,#333b2a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
header{background:var(--g);color:#f3f0e2;padding:20px max(5vw,16px)}
header h1{margin:0;font-size:clamp(22px,4vw,32px);line-height:1.1}header p{margin:4px 0 0;opacity:.85;font-size:14px}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
button,select{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
button:focus-visible,select:focus-visible{outline:3px solid #d4a017;outline-offset:2px}
.stat{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,30px)}
.meta{color:var(--mut);font-size:14px;display:flex;gap:10px;flex-wrap:wrap}
.q{font-size:clamp(18px,2.4vw,21px);font-weight:600;margin:8px 0 18px;line-height:1.4}
.op{display:flex;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:0 0 10px;height:auto;line-height:1.45}
.op b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gl);font-size:14px}
.op.sel{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}
.op.ok{background:var(--gl);border-color:var(--g)}.op.ok b{background:var(--g);color:#fff}
.op.no{background:var(--rl);border-color:var(--r)}.op.no b{background:var(--r);color:#fff}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:20px}
.grid button{padding:0;min-height:40px;font-size:13px}
.grid .cur{outline:2px solid var(--ink)}.grid .ok{background:var(--gl);border-color:var(--g)}.grid .no{background:var(--rl);border-color:var(--r)}.grid .an{background:var(--gl)}
.res{text-align:center}.res .big{font-size:clamp(48px,10vw,72px);font-weight:800;color:var(--g);line-height:1}
.hide{display:none}
</style></head><body>
<header><h1>Ôn tập trắc nghiệm Học phần 3</h1><p>Ngân hàng 200 câu · Trung tâm GDQP&AN · Hết giờ tự động nộp bài</p></header>
<main>
<div class="bar">
<select id="mode"><option value="20">Thi thử: 20 câu / 20 phút</option><option value="200">Ôn full: 200 câu / 200 phút</option></select>
<button class="p" id="start">Bắt đầu</button>
<span class="stat" id="stat"></span>
</div>
<div id="view"></div>
<div class="grid" id="grid"></div>
</main>
<script>{
const Q=
[{"n": 1, "lv": 1, "sh": 0, "q": "Theo Anh (chị) yếu tố quan trọng nhất tạo ra sức mạnh của quân đội Nhân dân Việt Nam là gì?", "o": ["Vũ khí hiện đại", "Trình độ khoa học", "Kỷ luật", "Số lượng quân"], "a": 2}, {"n": 2, "lv": 1, "sh": 0, "q": "Theo điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, có bao nhiêu chế độ sinh hoạt, học tập, công tác trong ngày?", "o": ["9", "10", "11", "12"], "a": 2}, {"n": 3, "lv": 1, "sh": 0, "q": "Theo điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, chế độ Treo Quốc kỳ được thực hiện vào thời gian nào trong ngày?", "o": ["05.00 giờ", "06.00 giờ", "07.00 giờ", "08.00 giờ"], "a": 1}, {"n": 4, "lv": 1, "sh": 0, "q": "Theo điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, Hạ Quốc kỳ được thực hiện vào thời gian nào trong ngày?", "o": ["17.00 giờ", "18.00 giờ", "19.00 giờ", "20.00 giờ"], "a": 1}, {"n": 5, "lv": 1, "sh": 0, "q": "Theo điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, khi có hiệu lệnh báo thức quân nhân phải làm gì?", "o": ["Dậy từ từ", "Chuẩn bị cá nhân theo quy định", "Dậy ngay theo quy định", "Chờ chỉ huy nhắc nhở"], "a": 2}, {"n": 6, "lv": 1, "sh": 0, "q": "Theo Điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, thời gian thể dục sáng là bao nhiêu phút?", "o": ["10 phút", "15 phút", "20 phút", "30 phút"], "a": 2}, {"n": 7, "lv": 1, "sh": 0, "q": "Theo Điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, khi học tập ngoài thao trường, việc đi và về được thực hiện như thế nào?", "o": ["Tự do", "Theo cá nhân", "Thành đội ngũ", "Theo quy định của giảng viên"], "a": 2}, {"n": 8, "lv": 1, "sh": 0, "q": "Theo Điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, khi học ngoài thao trường, Quân nhân phải làm gì?", "o": ["Chạy khởi động", "Khám súng, kiểm tra quân số", "Tập hợp tự do", "Nhận xét giáo viên"], "a": 1}, {"n": 9, "lv": 1, "sh": 0, "q": "Sau khi bắn đạn thật, vũ khí phải được?", "o": ["Cất ngay vào kho quân khí theo lệnh của chỉ huy", "Bàn giao cho bộ phận khác", "Bảo quản theo đúng quy trình kỹ thuật const $=id=>document.getElementById(id),L='ABCD';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S=null,timer=null;
function start(){
  const n=+$('mode').value,exam=true;let list=sh(Q.map((q,i)=>i)).slice(0,n);
  S={exam,n,items:list.map(i=>{const q=Q[i];const ord=q.sh?sh([0,1,2,3]):[0,1,2,3];return{q,ord,pick:null}}),cur:0,done:false,end:Date.now()+n*60e3};
  clearInterval(timer);timer=setInterval(tick,1000);render()}
function tick(){const s=Math.max(0,Math.round((S.end-Date.now())/1000));stat();if(!s)finish()}
function stat(){if(!S)return;const n=S.items.length,a=S.items.filter(x=>x.pick!==null).length,c=S.items.filter(x=>x.pick!==null&&x.ord[x.pick]===x.q.a).length;
  let t=`${a}/${n} đã làm`;if(!S.exam||S.done)t+=` · ${c} đúng`;if(S.exam&&!S.done){const s=Math.max(0,Math.round((S.end-Date.now())/1000));t+=` · ⏱ ${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}$('stat').textContent=t}
function render(){
  const it=S.items[S.cur],show=!S.exam&&it.pick!==null||S.done,lv=['','Dễ','Trung bình','Khó'][it.q.lv]||'';
  $('view').innerHTML=`<div class="card"><div class="meta"><span>Câu ${S.cur+1}/${S.items.length}</span><span>Câu gốc số ${it.q.n}</span><span>${lv}</span></div>
  <div class="q">${esc(it.q.q)}</div>${it.ord.map((o,k)=>{let c='';if(show){if(o===it.q.a)c='ok';else if(k===it.pick)c='no'}else if(k===it.pick)c='sel';
  return`<button class="op ${c}" data-k="${k}"><b>${L[k]}</b><span>${esc(it.q.o[o])}</span></button>`}).join('')}
  <div class="nav"><button id="prev">← Câu trước</button>${S.exam&&!S.done?'<button class="p" id="sub">Nộp bài</button>':''}<button id="next">Câu sau →</button></div></div>`;
  $('grid').innerHTML=S.items.map((x,i)=>{let c=i===S.cur?'cur ':'';if(x.pick!==null)c+=(!S.exam||S.done)?(x.ord[x.pick]===x.q.a?'ok':'no'):'an';return`<button class="${c}" data-i="${i}">${i+1}</button>`}).join('');
  stat()}
function finish(){if(S.done)return;S.done=true;clearInterval(timer);const c=S.items.filter(x=>x.pick!==null&&x.ord[x.pick]===x.q.a).length;
  render();$('view').insertAdjacentHTML('afterbegin',`<div class="card res" style="margin-bottom:14px"><div class="big">${(c*10/S.items.length).toLocaleString('vi-VN',{maximumFractionDigits:2})} / 10</div><p>Đúng ${c}/${S.items.length} câu. Bấm từng số bên dưới để xem lại đáp án.</p></div>`)}
$('start').onclick=()=>{if(!S||S.done||S.items.every(x=>x.pick===null)){start();return}$('view').insertAdjacentHTML('afterbegin','<div class="card" id="cf" style="margin-bottom:14px">Bắt đầu đề mới sẽ bỏ bài đang làm. <button class="p" id="cy">Đồng ý</button> <button id="cn">Hủy</button></div>');$('cy').onclick=start;$('cn').onclick=()=>$('cf').remove()};
addEventListener('beforeunload',e=>{if(S&&!S.done&&S.items.some(x=>x.pick!==null))e.preventDefault()});
$('view').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k!==undefined){const it=S.items[S.cur];if(S.done||(!S.exam&&it.pick!==null))return;it.pick=+b.dataset.k;render();return}
  if(b.id==='prev'&&S.cur>0){S.cur--;render()}if(b.id==='next'&&S.cur<S.items.length-1){S.cur++;render()}if(b.id==='sub')finish()};
$('grid').onclick=e=>{const b=e.target.closest('button');if(b){S.cur=+b.dataset.i;render()}};
document.addEventListener('keydown',e=>{if(!S||e.target.tagName==='SELECT')return;if(e.key==='ArrowRight'&&S.cur<S.items.length-1){S.cur++;render()}if(e.key==='ArrowLeft'&&S.cur>0){S.cur--;render()}
  const k='abcd1234'.indexOf(e.key.toLowerCase());if(k>=0){const b=document.querySelector(`.op[data-k="${k%4}"]`);b&&b.click()}});
