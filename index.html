<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f4220"><title>Ôn trắc nghiệm GDQP&AN · HP3 & HP4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Big+Shoulders+Stencil+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: gọn, nghiêm như sổ tay huấn luyện
IDEA: phiếu trả lời trắc nghiệm trên thao trường
PICTURE: thẻ câu hỏi + phiếu tô ô, bia bắn khi chấm điểm
COLOUR and TYPE: xanh quân phục, kaki, đỏ sao, vàng; Be Vietnam Pro + Big Shoulders Stencil
LAYOUT: một cột, thanh tiến độ dính trên */
:root{color-scheme:light dark;
--bg:light-dark(#ece6d3,#12160e);--paper:light-dark(#fbf8ef,#1c2216);--ink:light-dark(#1f2618,#e8ebde);--mut:light-dark(#646c55,#9fa88f);
--g:#2f4220;--g2:light-dark(#4d6b33,#8fb46a);--gl:light-dark(#e1e9d2,#26331b);--r:#b8322a;--rl:light-dark(#f6ddd8,#43211d);
--gold:#c9971a;--line:light-dark(#d8d0b8,#323a28);--sh:light-dark(0 1px 0 #d8d0b8,0 2px 18px #0006);
--st:"Big Shoulders Stencil Display",Impact,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip;
background-image:radial-gradient(light-dark(#0000000a,#ffffff06) 1px,transparent 1px);background-size:18px 18px}
button,select{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* header */
header{background:var(--g);color:#f1ecd9;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:auto 0 0;height:8px;background:repeating-linear-gradient(-45deg,var(--gold) 0 14px,#1f2c15 14px 28px)}
.hd{max-width:900px;margin:0 auto;padding:22px 18px 28px;display:flex;gap:16px;align-items:center}
.star{flex:none;width:52px;height:52px;border-radius:50%;background:var(--r);display:grid;place-items:center;box-shadow:0 0 0 3px var(--gold)}
.star svg{width:30px;fill:#ffd94a}
header h1{margin:0;font:900 clamp(26px,5vw,40px)/1 var(--st);letter-spacing:.02em;text-transform:uppercase}
header p{margin:5px 0 0;opacity:.8;font-size:14px}
main{max-width:900px;margin:0 auto;padding:22px 16px 80px}
/* setup */
.lbl{font:700 13px/1 "Be Vietnam Pro";letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mod{position:relative;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:16px 16px 14px;cursor:pointer;transition:.15s;box-shadow:var(--sh)}
.mod:hover{transform:translateY(-2px)}
.mod .no{font:900 44px/1 var(--st);color:var(--g2)}
.mod .t{font-weight:700;margin-top:4px}.mod .d{font-size:13px;color:var(--mut)}
.mod[aria-pressed=true]{border-color:var(--g2);background:var(--gl)}
.mod[aria-pressed=true]::after{content:"ĐÃ CHỌN";position:absolute;top:12px;right:10px;font:800 11px/1 "Be Vietnam Pro";letter-spacing:.1em;color:var(--r);border:2px solid var(--r);padding:4px 6px;border-radius:4px;transform:rotate(8deg)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.md{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;min-height:44px}
.md b{display:block}.md span{font-size:13px;color:var(--mut)}
.md[aria-pressed=true]{border-color:var(--g2);background:var(--gl)}
.md:disabled{opacity:.45;cursor:not-allowed}
.go{margin-top:22px;width:100%;min-height:58px;border:0;border-radius:14px;background:var(--r);color:#fff;font:900 24px/1 var(--st);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 #7d1f19}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #7d1f19}
.tips{margin-top:16px;color:var(--mut);font-size:13px;text-align:center}
.lvf{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:0 14px;min-height:40px;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
/* quiz */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;display:flex;align-items:center;gap:12px}
.tag{font:800 12px/1 "Be Vietnam Pro";letter-spacing:.1em;background:var(--g);color:#fff;padding:7px 10px;border-radius:6px;white-space:nowrap}
.prog{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--g2);transition:width .3s}
.clock{font:900 26px/1 var(--st);font-variant-numeric:tabular-nums;letter-spacing:.04em;white-space:nowrap}
.clock.low{color:var(--r);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.4}}
.xb{border:2px solid var(--line);background:var(--paper);border-radius:10px;min-height:40px;padding:0 12px;cursor:pointer;font-size:14px}
.card{background:var(--paper);border-radius:16px;padding:clamp(18px,3.5vw,32px);box-shadow:var(--sh);border:1px solid var(--line);position:relative}
.card::before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:4px;border-radius:0 4px 4px 0;background:var(--g2)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
.meta .num{font:900 34px/1 var(--st);color:var(--ink);margin-right:6px}
.pill{border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.pill.l1{color:var(--g2)}.pill.l2{color:var(--gold)}.pill.l3{color:var(--r)}
.q{font-size:clamp(18px,2.5vw,22px);font-weight:600;margin:12px 0 20px;line-height:1.45}
.op{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:13px 16px;margin:0 0 10px;border-radius:12px;border:2px solid var(--line);background:transparent;cursor:pointer;line-height:1.45;transition:background .12s,border-color .12s}
.op:hover{border-color:var(--g2)}
.op b{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--g2);color:var(--g2);font:900 17px/1 var(--st)}
.op span{padding-top:4px}
.op.sel{border-color:var(--g2);background:var(--gl)}.op.sel b{background:var(--g2);color:var(--paper)}
.op.ok{border-color:var(--g2);background:var(--gl)}.op.ok b{background:var(--g2);color:var(--paper);border-color:var(--g2)}
.op.no{border-color:var(--r);background:var(--rl)}.op.no b{background:var(--r);border-color:var(--r);color:#fff}
.op.ok span::after{content:" ✓";font-weight:800;color:var(--g2)}
.fb{margin:6px 0 0;font-weight:700}.fb.ok{color:var(--g2)}.fb.no{color:var(--r)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.nav button{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--paper);padding:0 18px;cursor:pointer;font-weight:600}
.nav .p{background:var(--g);color:#fff;border-color:var(--g)}
.sheet{margin-top:22px;background:var(--paper);border:1px dashed var(--mut);border-radius:14px;padding:14px}
.sheet h3{margin:0 0 10px;font:800 12px/1 "Be Vietnam Pro";letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{aspect-ratio:1;min-height:38px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;font:700 13px/1 "Be Vietnam Pro";padding:0}
.grid .an{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid .ok{background:var(--g2);color:var(--paper);border-color:var(--g2)}.grid .no{background:var(--r);color:#fff;border-color:var(--r)}
.grid .cur{box-shadow:0 0 0 3px var(--gold)}
/* result */
.res{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-bottom:16px}
.tgt{width:170px;height:170px;position:relative}
.tgt svg{width:100%;height:100%}
.tgt .sc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:900 46px/1 var(--st)}
.tgt .sc small{display:block;font:600 13px "Be Vietnam Pro";color:var(--mut)}
.res h2{margin:0;font:900 32px/1.05 var(--st);text-transform:uppercase}
.res p{margin:6px 0 12px;color:var(--mut)}
.res .row{display:flex;gap:8px;flex-wrap:wrap}
.hide{display:none!important}
@media(max-width:640px){
.hd{padding:16px 14px 22px}.star{width:42px;height:42px}.star svg{width:24px}
main{padding:14px 12px 60px}
.mods{grid-template-columns:1fr}.mod{display:flex;gap:14px;align-items:center}.mod .no{font-size:36px;width:64px}
.modes{grid-template-columns:1fr 1fr}
.card{padding:18px 16px}.q{font-size:17px}.op{padding:11px 12px;font-size:15px;gap:10px}.op b{width:28px;height:28px}
.nav button{flex:1;padding:0 8px;font-size:14px}
.res{grid-template-columns:1fr;justify-items:center;text-align:center}.res .row{justify-content:center}
.clock{font-size:22px}}
</style></head><body>
<header><div class="hd"><div class="star"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7.1L12 17.6 5.8 21.3l1.6-7.1L2 9.5l7.1-.6z"/></svg></div>
<div><h1>Thao trường trắc nghiệm</h1><p>GDQP&AN · Học phần 3 (200 câu) & Học phần 4 (300 câu)</p></div></div></header>
<main id="app"></main>
<script>{
const HP3=[{"n": 1, "lv": 1, "sh": 0, "q": "Theo Anh (chị) yếu tố quan trọng nhất tạo ra sức mạnh của quân đội Nhân dân Việt Nam là gì?", "o": ["Vũ khí hiện đại", "Trình độ khoa học", "Kỷ luật", "Số lượng quân"], "a": 2}, {"n": 2, "lv": 1, "sh": 0, "q": "Theo điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, có bao nhiêu chế độ sinh hoạt, học tập, công tác trong ngày?", "o": ["9", "10", "11", "12"], "a": 2}, {"n": 3, "lv": 1, "sh": 0, "q": "Theo điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, chế độ Treo Quốc kỳ được thực hiện vào thời gian nào trong ngày?", "o": ["05.00 giờ", "06.00 giờ", "07.00 giờ", "08.00 giờ"], "a": 1}, {"n": 4, "lv": 1, "sh": 0, "q": "Theo điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, Hạ Quốc kỳ được thực hiện vào thời gian nào trong ngày?", "o": ["17.00 giờ", "18.00 giờ", "19.00 giờ", "20.00 giờ"], "a": 1}, {"n": 5, "lv": 1, "sh": 0, "q": "Theo điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, khi có hiệu lệnh báo thức quân nhân phải làm gì?", "o": ["Dậy từ từ", "Chuẩn bị cá nhân theo quy định", "Dậy ngay theo quy định", "Chờ chỉ huy nhắc nhở"], "a": 2}, {"n": 6, "lv": 1, "sh": 0, "q": "Theo Điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, thời gian thể dục sáng là bao nhiêu phút?", "o": ["10 phút", "15 phút", "20 phút", "30 phút"], "a": 2}, {"n": 7, "lv": 1, "sh": 0, "q": "Theo Điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, khi học tập ngoài thao trường, việc đi và về được thực hiện như thế nào?", "o": ["Tự do", "Theo cá nhân", "Thành đội ngũ", "Theo quy định của giảng viên"], "a": 2}, {"n": 8, "lv": 1, "sh": 0, "q": "Theo Điều lệnh quản lý bộ đội Quân đội Nhân dân Việt Nam, khi học ngoài thao trường, Quân nhân phải làm gì?", "o": ["Chạy khởi động", "Khám súng, kiểm tra quân số", "Tập hợp tự do", "Nhận xét giáo viên"], "a": 1}, {"n": 9, "lv": 1, "sh": 0, "q": "Sau khi bắn đạn thật, vũ khí phải được?", "o": ["Cất ngay vào kho quân khí theo lệnh của chỉ huy", "Bàn giao cho bộ phận khác", "Bảo quản theo đúng quy trìn , "2", "3", "4"], "a": 0}, {"n": 188, "lv": 2, "sh": 0, "q": "Yêu cầu chiến thuật “Dũng cảm, linh hoạt, kịp thời” là yêu cầu chiến thuật thứ mấy trong chiến đấu tiến công?", "o": ["1", "2", "3", "4"], "a": 1}, {"n": 189, "lv": 2, "sh": 0, "q": "Yêu cầu chiến thuật “Độc lập chiến đấu, chủ động hiệp đồng, liên tục chiến đấu” là yêu cầu chiến thuật thứ mấy trong chiến đấu tiến công?", "o": ["1", "2", "3", "4"], "a": 3}, {"n": 190, "lv": 2, "sh": 0, "q": "Trước khi đánh ụ súng chiến sĩ phải làm gì?", "o": ["Bí mật tiếp cận vào bên sườn phía sau, đến cự ly thích hợp, dùng thủ pháo lựu đạn ném vào bên trong ụ súng.", "Phải quan sát nghe ngóng địch, địa hình, nhanh chóng vận động, tiếp cận mục tiêu", "Phải quan sát nghe ngóng địch, địa hình để tìm chỗ sơ hở, chỗ yếu của ụ súng lô cốt như góc cấn tử giác lối ra vào đường kín đáo bên sườn phía sau và căn cứ vào VKTB của mình để xác định cách đánh cho phù hợp.", "Bí mật tiếp cận vào bên sườn phía sau, đến cự ly thích hợp, dùng thủ pháo lựu đạn ném vào bên trong ụ súng. Lợi dụng khi khói đạn mù mịt nhanh chóng xông lên bắn găm, bắn gần, đâm lê tiêu diệt địch còn sống sót."], "a": 2}, {"n": 191, "lv": 2, "sh": 0, "q": "Khi đánh ụ súng không có nắp chiến sĩ phải làm gì?", "o": ["Bí mật tiếp cận vào bên sườn phía sau, đến cự ly thích hợp, dùng thủ pháo lựu đạn ném vào bên trong ụ súng.", "Phải quan sát nghe ngóng địch, địa hình, nhanh chóng vận động, tiếp cận mục tiêu", "Phải quan sát nghe ngóng địch, địa hình để tìm chỗ sơ hở, chỗ yếu của ụ súng lô cốt như góc cấn tử giác lối ra vào đường kín đáo bên sườn phía sau và căn cứ vào VKTB của mình để xác định cách đánh cho phù hợp.", "Bí mật tiếp cận vào bên sườn phía sau, đến cự ly thích hợp, dùng thủ pháo lựu đạn ném vào bên trong ụ súng. Lợi dụng khi khói đạn mù mịt nhanh chóng xông lên bắn găm, bắn gần, đâm lê tiêu diệt địch còn sống sót."], "a": 3}, {"n": 192, "lv": 2, "sh": 0, "q": "Khi đánh ụ súng có nắp chiến sĩ phải làm gì?", "o": ["Phải quan sát nghe ngóng địch, địa hình để hững căn cứ để làm công tác chuẩn bị của từng người trong chiến đấu tiến công là gì?", "o": ["Nhiệm vụ của trung đội.", "Nhiệm vụ được phân công.", "Nhiệm vụ của đại đội.", "Nhiệm vụ của tiểu đoàn."], "a": 1}, {"n": 210, "lv": 2, "sh": 0, "q": "Từng người trong chiến đấu tiến công, phương pháp làm công tác chuẩn bị phải căn cứ vào đâu để tiến hành?", "o": ["Ý định tiến công của địch.", "Ý định của người chỉ huy, nhiệm vụ được phân công, thời gian có.", "Ý định của bản thân và đồng đội có liên quan, nhiệm vụ được phân công, thời gian có.", "Ý định của đồng đội có liên quan."], "a": 1}, {"n": 211, "lv": 2, "sh": 0, "q": "Từng người trong chiến đấu tiến công, khi làm công tác chuẩn bị phải bảo đảm yêu cầu gì?", "o": ["Nhanh, gọn, đầy đủ, chính xác", "Chỉ cần đủ số lượng, chất lượng, không cần bảo đảm thời gian.", "Nhanh, gọn, đầy đủ, tương đối chính xác", "Nhanh, gọn, chính xác"], "a": 0}, {"n": 212, "lv": 2, "sh": 0, "q": "Công tác chuẩn bị của từng người trong chiến đấu tiến công phải được tiến hành như thế nào?", "o": ["Được tiến hành thường xuyên.", "Được tiến hành nhanh chóng.", "Được tiến hành trước khi nhận nhiệm vụ.", "Được tiến hành sau khi nhận nhiệm vụ."], "a": 0}, {"n": 213, "lv": 2, "sh": 0, "q": "Xác định vị trí tạm dừng và cách nghi binh lừa địch nằm trong nội dung nào dưới đây?", "o": ["Khi vận động đến gần địch.", "Trước khi vận động đến gần địch.", "Thực hành đánh chiếm mục tiêu.", "Làm công tác chuẩn bị."], "a": 1}, {"n": 214, "lv": 2, "sh": 0, "q": "Các ụ súng thường được nối liền với nhau như thế nào ?", "o": ["Bằng các đoạn đường lộ thiên.", "Bằng đường ngầm trong lòng đất.", "Bằng tường đất hoặc bằng các hào sâu.", "Bằng đoạn hào nổi."], "a": 2}, {"n": 215, "lv": 2, "sh": 0, "q": "Lô cốt của địch thường được cấu trúc theo kiểu hình gì?", "o": ["Hình tam giác", "Hình đa giác", "Hình lục giác", "Hình lăng trụ."], "a": 3}, {"n": 216, "lv": 2, "sh": 0, "q": "Khi đánh ụ súng có nắp, lô cốt, nếu cửa ra vào địch đóng kín thì đánh như thế nào?", "o": ["B HP3.forEach(q=>q.m=3);HP4.forEach(q=>q.m=4);
const $=s=>document.querySelector(s),L='ABCD';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const key=q=>q.m+'-'+q.n+'-'+q.q.length;
let wrong={};try{wrong=JSON.parse(localStorage.getItem('gdqp-wrong')||'{}')}catch(e){}
const saveW=()=>{try{localStorage.setItem('gdqp-wrong',JSON.stringify(wrong))}catch(e){}};
const cfg={mod:'4',mode:'exam',lv:0};
let S=null,timer=null;
const pool=()=>{let p=cfg.mod==='3'?HP3:cfg.mod==='4'?HP4:HP3.concat(HP4);if(cfg.lv)p=p.filter(q=>q.lv===cfg.lv);return p};
const lvName=['','Dễ','Trung bình','Khó'];

function setup(){
  clearInterval(timer);S=null;
  const wc=Object.keys(wrong).length,pl=pool().length;
  $('#app').innerHTML=`
  <div class="lbl">① Chọn học phần</div>
  <div class="mods">${[['3','HP3','200 câu','Điều lệnh, đội ngũ, bản đồ, VKCNC'],['4','HP4','300 câu','Kỹ thuật bắn, chiến thuật, thực hành'],['all','3+4','500 câu','Trộn cả hai học phần']].map(([v,a,b,c])=>`<button class="mod" data-mod="${v}" aria-pressed="${cfg.mod===v}"><div class="no">${a}</div><div><div class="t">${b}</div><div class="d">${c}</div></div></button>`).join('')}</div>
  <div class="lbl">② Chọn mức độ</div>
  <div class="lvf">${['Tất cả','Dễ','Trung bình','Khó'].map((t,i)=>`<button class="chip" data-lv="${i}" aria-pressed="${cfg.lv===i}">${t}</button>`).join('')}</div>
  <div class="lbl">③ Kiểu làm bài</div>
  <div class="modes">
   <button class="md" data-mode="exam" aria-pressed="${cfg.mode==='exam'}"><b>Thi thử</b><span>20 câu · 20 phút · chấm cuối</span></button>
   <button class="md" data-mode="learn" aria-pressed="${cfg.mode==='learn'}"><b>Luyện tập</b><span>20 câu · hiện đáp án ngay</span></button>
   <button class="md" data-mode="full" aria-pressed="${cfg.mode==='full'}"><b>Ôn toàn bộ</b><span>${pl} câu · hiện đáp án ngay</span></button>
   <button class="md" data-mode="wrong" aria-pressed="${cfg.mode==='wrong'}" ${wc?'':'disabled'}><b>Câu hay sai</b><span>${wc?wc+' câu đã lưu':'Chưa có câu nào'}</span></button>
  </div>
  <button class="go" id="go">Vào thao trường →</button>
  <p class="tips">Phím tắt: A–D hoặc 1–4 để chọn · ← → để chuyển câu · Câu làm sai được lưu lại để ôn sau.</p>`;
}
function start(){
  let list;
  if(cfg.mode==='wrong'){const all=HP3.concat(HP4);list=sh(all.filter(q=>wrong[key(q)]))}
  else{list=sh(pool());if(cfg.mode!=='full')list=list.slice(0,20)}
  if(!list.length)return;
  const exam=cfg.mode==='exam';
  S={exam,items:list.map(q=>({q,ord:q.sh?sh([0,1,2,3]):[0,1,2,3],pick:null})),cur:0,done:false,end:Date.now()+list.length*60e3};
  clearInterval(timer);if(exam)timer=setInterval(tick,1000);render();scrollTo({top:0})}
function tick(){if(S.end-Date.now()<=0){finish();return}clock()}
function clock(){const el=$('#clk');if(!el||!S.exam||S.done)return;const s=Math.max(0,Math.round((S.end-Date.now())/1000));el.textContent=`${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;el.classList.toggle('low',s<=60)}
const right=x=>x.pick!==null&&x.ord[x.pick]===x.q.a;
function mark(x){if(x.pick===null)return;const k=key(x.q);if(right(x))delete wrong[k];else wrong[k]=1;saveW()}
function render(){
  const it=S.items[S.cur],reveal=S.done||(!S.exam&&it.pick!==null),n=S.items.length,ans=S.items.filter(x=>x.pick!==null).length;
  const modTag=cfg.mode==='wrong'?'CÂU HAY SAI':cfg.mod==='all'?'HP3 + HP4':'HỌC PHẦN '+cfg.mod;
  $('#app').innerHTML=`
  <div class="bar"><span class="tag">${modTag}</span><div class="prog"><i style="width:${ans/n*100}%"></i></div>
  ${S.exam&&!S.done?'<span class="clock" id="clk"></span>':`<span class="clock">${ans}/${n}</span>`}<button class="xb" id="quit" title="Về trang chọn đề">✕</button></div>
  <div id="resbox"></div>
  <div class="card"><div class="meta"><span class="num">${String(S.cur+1).padStart(2,'0')}</span><span>/ ${n}</span><span class="pill">HP${it.q.m} · câu gốc ${it.q.n}</span><span class="pill l${it.q.lv}">${lvName[it.q.lv]||''}</span></div>
  <div class="q">${esc(it.q.q)}</div>
  ${it.ord.map((o,k)=>{let c='';if(reveal){if(o===it.q.a)c='ok';else if(k===it.pick)c='no'}else if(k===it.pick)c='sel';
   return`<button class="op ${c}" data-k="${k}"><b>${L[k]}</b><span>${esc(it.q.o[o])}</span></button>`}).join('')}
  ${!S.exam&&it.pick!==null?(right(it)?'<p class="fb ok">Chính xác!</p>':`<p class="fb no">Chưa đúng — đáp án là ${L[it.ord.indexOf(it.q.a)]}.</p>`):''}
  <div class="nav"><button id="prev" ${S.cur?'':'disabled'}>← Trước</button>${!S.done&&(S.exam||ans===n)?'<button class="p" id="sub">Nộp bài</button>':''}<button id="next" ${S.cur<n-1?'':'disabled'}>Sau →</button></div></div>
  <div class="sheet"><h3><span>Phiếu trả lời</span><span>${ans}/${n} đã chọn</span></h3><div class="grid">${S.items.map((x,i)=>{let c=i===S.cur?'cur ':'';if(x.pick!==null)c+=(S.done||!S.exam)?(right(x)?'ok':'no'):'an';return`<button class="${c}" data-i="${i}">${i+1}</button>`}).join('')}</div></div>`;
  clock();if(S.done)result()}
function result(){
  const n=S.items.length,c=S.items.filter(right).length,sc=c*5/n*(n===20?1:1),p=c/n;
  const rings=[5,4,3,2,1].map((v,i)=>`<circle cx="50" cy="50" r="${48-i*9.4}" fill="${i%2?'var(--paper)':'var(--gl)'}" stroke="var(--g2)" stroke-width="1"/>`).join('');
  const ang=Math.random()*6.28,dist=(1-p)*44;
  const msg=p>=.8?'Bắn trúng hồng tâm!':p>=.5?'Đạt yêu cầu':'Cần luyện thêm';
  $('#resbox').innerHTML=`<div class="card res"><div class="tgt"><svg viewBox="0 0 100 100">${rings}<circle cx="${50+Math.cos(ang)*dist}" cy="${50+Math.sin(ang)*dist}" r="4" fill="var(--r)" stroke="#fff" stroke-width="1.5"/></svg>
  <div class="sc"><div>${(Math.round(sc*100)/100).toLocaleString('vi-VN')}<small>/ 5 điểm</small></div></div></div>
  <div><h2>${msg}</h2><p>Đúng ${c}/${n} câu · ${Math.round(p*100)}%. Bấm từng ô trên phiếu để xem lại đáp án.</p>
  <div class="row"><button class="go" style="margin:0;width:auto;padding:0 22px;font-size:20px;min-height:48px" id="again">Làm đề mới</button><button class="xb" id="quit2">Đổi học phần</button></div></div></div>`}
function finish(){if(!S||S.done)return;S.done=true;clearInterval(timer);if(S.exam)S.items.forEach(mark);render();scrollTo({top:0,behavior:'smooth'})}
function pick(k){const it=S.items[S.cur];if(S.done||(!S.exam&&it.pick!==null))return;it.pick=k;if(!S.exam)mark(it);render()}
function go(d){const j=S.cur+d;if(j>=0&&j<S.items.length){S.cur=j;render()}}
function quit(){if(S&&!S.done&&S.items.some(x=>x.pick!==null)&&!confirmBox())return;setup()}
let askQuit=false;function confirmBox(){if(askQuit){askQuit=false;return true}askQuit=true;const b=$('#quit');if(b){b.textContent='Thoát? Bấm lần nữa';setTimeout(()=>{askQuit=false;b&&(b.textContent='✕')},2500)}return false}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.mod){cfg.mod=b.dataset.mod;if(cfg.mode==='wrong')cfg.mode='exam';setup();return}
  if(b.dataset.lv){cfg.lv=+b.dataset.lv;setup();return}
  if(b.dataset.mode){cfg.mode=b.dataset.mode;setup();return}
  if(b.id==='go'){start();return}
  if(!S)return;
  if(b.dataset.k!==undefined){pick(+b.dataset.k);return}
  if(b.dataset.i!==undefined){S.cur=+b.dataset.i;render();return}
  ({prev:()=>go(-1),next:()=>go(1),sub:finish,again:start,quit,quit2:setup})[b.id]?.()});
addEventListener('beforeunload',e=>{if(S&&!S.done&&S.items.some(x=>x.pick!==null))e.preventDefault()});
document.addEventListener('keydown',e=>{if(!S||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else{const k='abcd1234'.indexOf(e.key.toLowerCase());if(k>=0)pick(k%4)}});
setup();
}</script></body></html>
